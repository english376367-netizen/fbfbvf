const sections = [
{title:"Pronunciation", items:[
{q:'Find the word whose underlined part is pronounced differently.',opts:['<u>h</u>ouse','<u>h</u>ealthy','<u>h</u>appiness','<u>h</u>onest'],a:3,exp:'Chữ h trong house, healthy, happiness được phát âm /h/. Trong honest, h là âm câm.',meaning:'Tìm từ có phần gạch chân được phát âm khác.'},
{q:'Find the word whose underlined part is pronounced differently.',opts:['seve<u>r</u>al','regula<u>r</u>ly','i<u>r</u>on','envi<u>r</u>onment'],a:2,exp:'Trong iron, chữ r không được phát âm theo cách thể hiện trong các từ còn lại; các từ còn lại có âm /r/.',meaning:'Tìm từ có phần gạch chân được phát âm khác.'},
{q:'Find the word whose underlined part is pronounced differently.',opts:['kangaroo','wo<u>r</u>d','<u>r</u>ange','ae<u>r</u>obic'],a:1,exp:'Trong word, chữ r không được phát âm như âm /r/ đầu từ trong range và âm /r/ trong kangaroo/aerobic theo cách phân loại của bài.',meaning:'Tìm từ có phần gạch chân được phát âm khác.'},
{q:'Find the word whose underlined part is pronounced differently.',opts:['<u>h</u>orror','<u>h</u>ologram','<u>h</u>onour','<u>h</u>oney'],a:2,exp:'Trong honour, h là âm câm; horror, hologram và honey phát âm /h/.',meaning:'Tìm từ có phần gạch chân được phát âm khác.'},
{q:'Find the word whose underlined part is pronounced differently.',opts:['remind','agree','forum','tu<u>r</u>n'],a:3,exp:'Trong turn, r không được phát âm thành /r/ như phần gạch chân ở các từ còn lại theo đáp án của bài.',meaning:'Tìm từ có phần gạch chân được phát âm khác.'}
]},
{title:"Vocabulary & Grammar",items:[
{q:'Match “well-balanced” with its definition.',opts:['The date by which something must be done or paid.','Made up of various things that form a healthy combination.','Something that distracts attention.','Expecting good things to happen.'],a:1,exp:'Well-balanced nghĩa là cân bằng tốt; định nghĩa đúng là sự kết hợp lành mạnh, hài hòa của nhiều yếu tố.',meaning:'Nối từ “well-balanced” với định nghĩa.'},
{q:'Match “priority” with its definition.',opts:['Something most important that must be dealt with first.','A feeling of worry.','A healthy meal.','A date for payment.'],a:0,exp:'Priority là điều được ưu tiên, quan trọng nhất và cần giải quyết trước những việc khác.',meaning:'Nối từ “priority” với định nghĩa.'},
{q:'I’ve got too much to do, and I’m completely _____.',opts:['optimistic','well-balanced','stressed out','priority'],a:2,exp:'Stressed out = căng thẳng, quá lo lắng và mệt mỏi. Cụm này phù hợp với việc có quá nhiều thứ phải làm.',meaning:'Tôi có quá nhiều việc phải làm và tôi hoàn toàn _____.',sentence:'I’ve got too much to do, and I’m completely stressed out.',vi:'Tôi có quá nhiều việc phải làm và tôi hoàn toàn căng thẳng.'},
{q:'This book has helped me lead a more _____ life.',opts:['distraction','well-balanced','due date','stressed out'],a:1,exp:'Well-balanced life là cuộc sống cân bằng, hài hòa.',meaning:'Cuốn sách này đã giúp tôi có một cuộc sống _____ hơn.',sentence:'This book has helped me lead a more well-balanced life.',vi:'Cuốn sách này đã giúp tôi có một cuộc sống cân bằng hơn.'},
{q:'The sports teachers are trying to help develop the _____ well-being of their students.',opts:['mental','intellectual','emotional','physical'],a:3,exp:'Physical well-being là sức khỏe thể chất. Ngữ cảnh nói về giáo viên thể thao nên physical phù hợp nhất.',meaning:'Các giáo viên thể thao đang cố gắng giúp học sinh phát triển sức khỏe _____.',sentence:'The sports teachers are trying to help develop the physical well-being of their students.',vi:'Các giáo viên thể thao đang cố gắng giúp học sinh phát triển thể chất khỏe mạnh.'},
{q:'When working outside, farmers should dress _____ for the weather.',opts:['acceptably','correctly','appropriately','smartly'],a:2,exp:'Appropriately = một cách phù hợp. Cụm dress appropriately for the weather nghĩa là ăn mặc phù hợp với thời tiết.',meaning:'Khi làm việc ngoài trời, nông dân nên ăn mặc _____ với thời tiết.',sentence:'When working outside, farmers should dress appropriately for the weather.',vi:'Khi làm việc ngoài trời, nông dân nên ăn mặc phù hợp với thời tiết.'},
{q:'Children normally feel a lot of _____ about their first day at school.',opts:['anxiety','calm','hurry','suffering'],a:0,exp:'Anxiety là sự lo lắng; cấu trúc feel anxiety about something = cảm thấy lo lắng về điều gì.',meaning:'Trẻ em thường cảm thấy rất _____ về ngày đầu tiên đến trường.',sentence:'Children normally feel a lot of anxiety about their first day at school.',vi:'Trẻ em thường cảm thấy rất lo lắng về ngày đầu tiên đến trường.'},
{q:'Before you ask him, wait until he’s in a better _____.',opts:['emotion','opinion','feeling','mood'],a:3,exp:'Cụm cố định in a good/better mood nghĩa là có tâm trạng tốt.',meaning:'Trước khi hỏi anh ấy, hãy đợi đến khi anh ấy có _____ tốt hơn.',sentence:'Before you ask him, wait until he’s in a better mood.',vi:'Trước khi hỏi anh ấy, hãy đợi cho đến khi anh ấy có tâm trạng tốt hơn.'},
{q:'It takes a lot of _____ effort to understand these ideas.',opts:['bodily','mental','physical','emotional'],a:1,exp:'Mental effort là nỗ lực trí óc/tinh thần để hiểu và suy nghĩ.',meaning:'Cần rất nhiều nỗ lực _____ để hiểu những ý tưởng này.',sentence:'It takes a lot of mental effort to understand these ideas.',vi:'Cần rất nhiều nỗ lực trí óc để hiểu những ý tưởng này.'},
{q:'If she _____ to follow the traditional recipe, she should not put curry powder in the dish.',opts:['want','wants','wanted','wanting'],a:1,exp:'Câu điều kiện loại 1: If + hiện tại đơn, mệnh đề chính có thể dùng should + động từ nguyên mẫu. Chủ ngữ she nên động từ thêm -s.',meaning:'Nếu cô ấy muốn làm theo công thức truyền thống, cô ấy không nên cho bột cà ri vào món ăn.',sentence:'If she wants to follow the traditional recipe, she should not put curry powder in the dish.',vi:'Nếu cô ấy muốn làm theo công thức truyền thống, cô ấy không nên cho bột cà ri vào món ăn.'},
{q:'If you _____ in a hurry, you may have a cup of tea now.',opts:['aren’t','isn’t','don’t','wasn’t'],a:0,exp:'Với chủ ngữ you, động từ be ở hiện tại là are; dạng phủ định là are not/aren’t.',meaning:'Nếu bạn không vội, bạn có thể uống một tách trà ngay bây giờ.',sentence:'If you aren’t in a hurry, you may have a cup of tea now.',vi:'Nếu bạn không vội, bạn có thể uống một tách trà ngay bây giờ.'},
{q:'If you want to have a healthy heart, you _____ eat less salt.',opts:['may','should','might','would'],a:1,exp:'Should dùng để đưa ra lời khuyên: bạn nên ăn ít muối.',meaning:'Nếu bạn muốn có trái tim khỏe mạnh, bạn _____ ăn ít muối.',sentence:'If you want to have a healthy heart, you should eat less salt.',vi:'Nếu bạn muốn có trái tim khỏe mạnh, bạn nên ăn ít muối.'}
]},
{title:"Speaking",items:[
{q:'A: Have you seen the new movie that has just come out? B: Sorry, could you repeat the question? _____.',opts:['I didn’t catch what you said.','I quite followed what you asked me.','I didn’t know for sure.','I didn’t think so.'],a:0,exp:'“I didn’t catch what you said” là cách lịch sự để nói rằng mình chưa nghe rõ và muốn người kia nhắc lại.',meaning:'A: Bạn đã xem bộ phim mới vừa ra mắt chưa? B: Xin lỗi, bạn có thể nhắc lại câu hỏi không? Tôi _____.',sentence:'Sorry, could you repeat the question? I didn’t catch what you said.',vi:'Xin lỗi, bạn có thể nhắc lại câu hỏi không? Tôi chưa nghe rõ bạn nói gì.'},
{q:'A: I need some assistance, please. B: _____.',opts:['Yes, please. I’d love to.','Sure. How can I help you?','Thanks. That would be great.','Don’t worry. I’ll do it myself.'],a:1,exp:'Khi ai đó cần giúp đỡ, câu đáp phù hợp là “Sure. How can I help you?” (Được chứ. Tôi có thể giúp gì cho bạn?).',meaning:'A: Tôi cần được giúp đỡ. B: _____.',sentence:'Sure. How can I help you?',vi:'Được chứ. Tôi có thể giúp gì cho bạn?'},
{q:'Shop assistant: Can I help you? Customer: _____.',opts:['Yes, please, but I think I can manage it.','No, thank you. I’m just looking.','Yes, please. I’m just browsing.','No, thanks. I’d like to buy some pork.'],a:1,exp:'“No, thank you. I’m just looking” là cách tự nhiên để từ chối sự giúp đỡ lịch sự khi chỉ đang xem hàng.',meaning:'Nhân viên: Tôi có thể giúp gì cho quý khách? Khách hàng: _____.',sentence:'No, thank you. I’m just looking.',vi:'Không, cảm ơn. Tôi chỉ xem thôi.'},
{q:'A: Hi, can you tell me more about the benefits of exercise? B: _____.',opts:['Pardon my asking you.','Excuse me, could you let me through?','No problem. I couldn’t agree more.','I beg your pardon?'],a:3,exp:'“I beg your pardon?” có thể dùng để yêu cầu người khác nhắc lại khi chưa nghe rõ câu hỏi.',meaning:'A: Bạn có thể nói thêm cho tôi về lợi ích của việc tập thể dục không? B: _____.',sentence:'I beg your pardon?',vi:'Xin lỗi, bạn có thể nhắc lại được không?'},
{q:'A: First you should underline the keywords. Then locate them in the reading text. B: _____.',opts:['Yes, I don’t know their meaning.','Can you do that again?','Can you say that again?','I don’t know what to do.'],a:2,exp:'“Can you say that again?” là lời đề nghị lịch sự để người nói nhắc lại hướng dẫn.',meaning:'A: Trước tiên, bạn nên gạch chân từ khóa. Sau đó tìm chúng trong bài đọc. B: _____.',sentence:'Can you say that again?',vi:'Bạn có thể nói lại điều đó được không?'},
{q:'Choose the best response to ask for clarification politely.',opts:['What?','Say it again now.','Could you explain that a little more, please?','You are wrong.'],a:2,exp:'“Could you …, please?” là cấu trúc yêu cầu lịch sự. Câu này phù hợp khi muốn người khác giải thích rõ hơn.',meaning:'Chọn câu đáp phù hợp nhất để yêu cầu giải thích rõ hơn một cách lịch sự.',sentence:'Could you explain that a little more, please?',vi:'Bạn có thể giải thích điều đó rõ hơn một chút được không?'}
]},
{title:"Reading",items:[
{q:'Passage 1 – Choose the correct option for blank (1).',reading:'We can manage our time effectively by (1) _____ some of these strategies. Firstly, it is important to (2) _____ clear and realistic goals and prioritise tasks accordingly. This means that you must identify (3) _____ is the most important and urgent and allocate time and resources (4) _____. Next, creating a schedule or to-do list can be helpful in staying on track and ensuring that all tasks are completed within the time allotted. Thirdly, it is important to learn to say no to distractions and time-wasting activities such as checking social media. Instead, you should focus on the task at hand and work efficiently to complete it.',readingVi:'Chúng ta có thể quản lý thời gian hiệu quả bằng cách áp dụng một số chiến lược sau. Trước tiên, điều quan trọng là đặt ra các mục tiêu rõ ràng, thực tế và ưu tiên công việc tương ứng. Điều này có nghĩa là bạn phải xác định điều gì quan trọng và cấp bách nhất rồi phân bổ thời gian, nguồn lực phù hợp. Tiếp theo, lập lịch trình hoặc danh sách việc cần làm giúp bạn đi đúng hướng và hoàn thành nhiệm vụ trong thời gian cho phép. Thứ ba, cần học cách nói không với những yếu tố gây xao nhãng và hoạt động lãng phí thời gian như kiểm tra mạng xã hội. Thay vào đó, hãy tập trung vào nhiệm vụ trước mắt và làm việc hiệu quả để hoàn thành nó.',opts:['follow','following','to follow','followed'],a:1,exp:'Sau giới từ by, động từ dùng dạng V-ing. Vì vậy chọn following.',meaning:'Chúng ta có thể quản lý thời gian hiệu quả bằng cách _____ một số chiến lược này.',sentence:'We can manage our time effectively by following some of these strategies.',vi:'Chúng ta có thể quản lý thời gian hiệu quả bằng cách làm theo một số chiến lược này.'},
{q:'Passage 1 – Choose the correct option for blank (2).',reading:'We can manage our time effectively by (1) _____ some of these strategies. Firstly, it is important to (2) _____ clear and realistic goals and prioritise tasks accordingly. This means that you must identify (3) _____ is the most important and urgent and allocate time and resources (4) _____. Next, creating a schedule or to-do list can be helpful in staying on track and ensuring that all tasks are completed within the time allotted. Thirdly, it is important to learn to say no to distractions and time-wasting activities such as checking social media. Instead, you should focus on the task at hand and work efficiently to complete it.',readingVi:'Chúng ta có thể quản lý thời gian hiệu quả bằng cách áp dụng một số chiến lược sau. Trước tiên, điều quan trọng là đặt ra các mục tiêu rõ ràng, thực tế và ưu tiên công việc tương ứng. Điều này có nghĩa là bạn phải xác định điều gì quan trọng và cấp bách nhất rồi phân bổ thời gian, nguồn lực phù hợp. Tiếp theo, lập lịch trình hoặc danh sách việc cần làm giúp bạn đi đúng hướng và hoàn thành nhiệm vụ trong thời gian cho phép. Thứ ba, cần học cách nói không với những yếu tố gây xao nhãng và hoạt động lãng phí thời gian như kiểm tra mạng xã hội. Thay vào đó, hãy tập trung vào nhiệm vụ trước mắt và làm việc hiệu quả để hoàn thành nó.',opts:['make','do','put','take'],a:0,exp:'Cụm make goals nghĩa là đặt ra mục tiêu. “Make clear and realistic goals” phù hợp với ngữ cảnh.',meaning:'Điều quan trọng là _____ các mục tiêu rõ ràng và thực tế.',sentence:'It is important to make clear and realistic goals.',vi:'Điều quan trọng là đặt ra các mục tiêu rõ ràng và thực tế.'},
{q:'Passage 1 – Choose the correct option for blank (3).',reading:'We can manage our time effectively by (1) _____ some of these strategies. Firstly, it is important to (2) _____ clear and realistic goals and prioritise tasks accordingly. This means that you must identify (3) _____ is the most important and urgent and allocate time and resources (4) _____. Next, creating a schedule or to-do list can be helpful in staying on track and ensuring that all tasks are completed within the time allotted.',readingVi:'Chúng ta có thể quản lý thời gian hiệu quả bằng cách áp dụng một số chiến lược sau. Trước tiên, điều quan trọng là đặt ra các mục tiêu rõ ràng, thực tế và ưu tiên công việc tương ứng. Điều này có nghĩa là bạn phải xác định điều gì quan trọng và cấp bách nhất rồi phân bổ thời gian, nguồn lực phù hợp.',opts:['who','where','what','whose'],a:2,exp:'What làm đại từ để chỉ “điều gì/cái gì” trong mệnh đề “identify what is the most important and urgent”.',meaning:'Bạn phải xác định _____ là điều quan trọng và cấp bách nhất.',sentence:'You must identify what is the most important and urgent.',vi:'Bạn phải xác định điều gì là quan trọng và cấp bách nhất.'},
{q:'Passage 1 – Choose the correct option for blank (4).',reading:'This means that you must identify what is the most important and urgent and allocate time and resources (4) _____.',readingVi:'Điều này có nghĩa là bạn phải xác định điều gì quan trọng và cấp bách nhất rồi phân bổ thời gian và nguồn lực tương ứng.',opts:['according','accordingly','accord','accordance'],a:1,exp:'Chỗ trống cần trạng từ bổ nghĩa cho động từ allocate. Accordingly nghĩa là tương ứng/phù hợp với điều đó.',meaning:'Bạn cần phân bổ thời gian và nguồn lực _____.',sentence:'Allocate time and resources accordingly.',vi:'Phân bổ thời gian và nguồn lực tương ứng.'},
{q:'Passage 2 – What is one important thing to remember when setting goals for a healthy lifestyle?',reading:'Goal setting is a crucial process that involves careful consideration of what you want to accomplish and requires persistent effort to make it a reality. Establishing goals gives you a target to strive for and helps to keep you motivated. In the pursuit of a healthy lifestyle, setting realistic goals is the key to success. If you want to quit smoking, lose a significant amount of weight, or run a marathon, it is unlikely to happen overnight. To avoid feeling overwhelmed, it is advisable to start small and concentrate on one goal at a time. For example, you can start by working out at least three times a week or adding more vegetables to your meals when you want seconds. Once these small goals become part of your routine, you can gradually add new goals.',readingVi:'Đặt mục tiêu là một quá trình quan trọng, đòi hỏi cân nhắc kỹ điều bạn muốn đạt được và nỗ lực bền bỉ để biến nó thành hiện thực. Việc đặt mục tiêu cho bạn đích đến để phấn đấu và giúp bạn duy trì động lực. Để có lối sống lành mạnh, đặt ra các mục tiêu thực tế là chìa khóa thành công. Nếu muốn bỏ thuốc, giảm nhiều cân hoặc chạy marathon, những việc đó khó có thể xảy ra chỉ sau một đêm. Để tránh cảm thấy quá tải, nên bắt đầu từ những việc nhỏ và tập trung vào từng mục tiêu một. Ví dụ, bạn có thể tập thể dục ít nhất ba lần mỗi tuần hoặc thêm rau vào bữa ăn. Khi những mục tiêu nhỏ trở thành thói quen, bạn có thể dần dần bổ sung mục tiêu mới.',opts:['Set as many large goals as possible.','Focus on one small goal at a time.','Ignore small goals.','Make every goal more difficult.'],a:1,exp:'Bài đọc khuyên bắt đầu từ mục tiêu nhỏ và tập trung vào từng mục tiêu một để không bị quá tải.',meaning:'Điều quan trọng cần nhớ khi đặt mục tiêu cho lối sống lành mạnh là gì?',vi:'Tập trung vào từng mục tiêu nhỏ một.'},
{q:'In the passage, “seconds” most nearly means _____.',reading:'For example, you can start by working out at least three times a week or adding more vegetables to your meals when you want seconds.',readingVi:'Ví dụ, bạn có thể bắt đầu bằng cách tập thể dục ít nhất ba lần một tuần hoặc thêm nhiều rau vào bữa ăn khi bạn muốn ăn thêm một phần nữa.',opts:['food sold at a lower price','another serving of food','half a meal','a few seconds of time'],a:1,exp:'“Want seconds” nghĩa là muốn ăn thêm một phần nữa sau phần ăn đầu tiên.',meaning:'Trong đoạn văn, “seconds” gần nghĩa nhất với _____.',vi:'Một phần thức ăn nữa.'},
{q:'What is one example of a small goal when trying to lose weight?',reading:'You can start by working out at least three times a week or adding more vegetables to your meals when you want seconds.',readingVi:'Bạn có thể bắt đầu bằng cách tập thể dục ít nhất ba lần mỗi tuần hoặc thêm nhiều rau vào bữa ăn khi muốn ăn thêm.',opts:['Lose a lot of weight in a month.','Run a marathon in fifteen days.','Add more vegetables to your plate.','Exercise every hour.'],a:2,exp:'Bài đọc nêu rõ ví dụ thêm nhiều rau vào bữa ăn là một mục tiêu nhỏ, khả thi.',meaning:'Đâu là ví dụ về mục tiêu nhỏ khi muốn giảm cân?',vi:'Thêm nhiều rau vào đĩa thức ăn.'},
{q:'When small goals become part of our routine, we should _____.',reading:'Once these small goals become part of your routine, you can gradually add new goals, such as limiting eating out to twice a week or incorporating weightlifting into your exercise routine.',readingVi:'Khi những mục tiêu nhỏ trở thành một phần thói quen, bạn có thể dần dần thêm mục tiêu mới, chẳng hạn hạn chế ăn ngoài hai lần mỗi tuần hoặc kết hợp tập tạ vào lịch tập.',opts:['give up setting goals','gradually add new goals','ignore progress','stop exercising'],a:1,exp:'Thông tin trong bài nói “gradually add new goals” – dần dần thêm các mục tiêu mới.',meaning:'Khi các mục tiêu nhỏ trở thành thói quen, chúng ta nên _____.',vi:'Dần dần thêm các mục tiêu mới.'},
{q:'Read the passage and choose True or False: Chi plans her schedule and sets priorities each day.',reading:'Chi, a student at a specialised high school in Ha Noi, wants a well-balanced life. Firstly, Chi starts each day by planning her schedule and setting priorities, allocating time for studying, extracurricular activities, and socialising. She takes breaks to relax. She dedicates time to hobbies such as reading, listening to music, and sports. Chi regularly spends time with family and friends and makes an effort to stay in touch even when busy. Finally, she prioritises physical and mental health: she gets enough sleep, eats a balanced diet, exercises regularly, and practises mindfulness and meditation to manage stress.',readingVi:'Chi, học sinh một trường THPT chuyên ở Hà Nội, mong muốn có một cuộc sống cân bằng. Đầu tiên, Chi bắt đầu mỗi ngày bằng việc lên kế hoạch và xác định các ưu tiên, phân bổ thời gian cho học tập, hoạt động ngoại khóa và giao lưu. Em nghỉ giải lao để thư giãn. Em dành thời gian cho sở thích như đọc sách, nghe nhạc và chơi thể thao. Chi thường xuyên dành thời gian cho gia đình, bạn bè và cố gắng giữ liên lạc ngay cả khi bận. Cuối cùng, em ưu tiên sức khỏe thể chất và tinh thần: ngủ đủ, ăn uống cân bằng, tập thể dục thường xuyên và thực hành chánh niệm, thiền để kiểm soát căng thẳng.',opts:['True','False'],a:0,exp:'Đoạn văn nói Chi bắt đầu mỗi ngày bằng việc lên lịch và đặt ưu tiên, vì vậy câu đúng (True).',meaning:'Chi lên kế hoạch và đặt ra các ưu tiên mỗi ngày.',vi:'Đúng.'},
{q:'Read the passage and choose True or False: Chi neglects her hobbies to focus on studying.',reading:'Chi dedicates time to her hobbies, such as reading, listening to music, and doing sports.',readingVi:'Chi dành thời gian cho các sở thích như đọc sách, nghe nhạc và chơi thể thao.',opts:['True','False'],a:1,exp:'Đoạn văn nói Chi vẫn dành thời gian cho sở thích, vì vậy câu “Chi bỏ bê sở thích” là sai (False).',meaning:'Chi bỏ bê sở thích để tập trung học tập.',vi:'Sai.'},
{q:'Read the passage and choose True or False: Chi prioritises both physical and mental health.',reading:'Chi gives priority to her physical and mental health. She gets enough sleep, eats a balanced diet, and exercises regularly.',readingVi:'Chi ưu tiên sức khỏe thể chất và tinh thần. Em ngủ đủ giấc, ăn uống cân bằng và tập thể dục thường xuyên.',opts:['True','False'],a:0,exp:'Thông tin nêu trực tiếp rằng Chi ưu tiên cả sức khỏe thể chất lẫn tinh thần, nên câu đúng (True).',meaning:'Chi ưu tiên cả sức khỏe thể chất và tinh thần.',vi:'Đúng.'}
]},
{title:"Writing",items:[
{q:'Put the words in the correct order: should / you / enough sleep / get / every night.',opts:['You should get enough sleep every night.','You get should enough sleep every night.','Every night enough sleep should you get.','You should every night get sleep enough.'],a:0,exp:'Trật tự đúng: S + should + động từ nguyên mẫu + tân ngữ/trạng ngữ. “Get enough sleep” là ngủ đủ giấc.',meaning:'Bạn nên ngủ đủ giấc mỗi đêm.',vi:'Bạn nên ngủ đủ giấc mỗi đêm.'},
{q:'Choose the sentence with correct grammar.',opts:['If you will exercise, you feel better.','If you exercise regularly, you may feel better.','If you exercised regularly, you may feel better tomorrow.','If you exercises regularly, you may feel better.'],a:1,exp:'Câu điều kiện loại 1: If + hiện tại đơn, S + may/will/can + động từ nguyên mẫu.',meaning:'Chọn câu đúng ngữ pháp.',sentence:'If you exercise regularly, you may feel better.',vi:'Nếu bạn tập thể dục thường xuyên, bạn có thể cảm thấy khỏe hơn.'},

let currentSection=0, currentQ={}, state={};
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init();}else document.getElementById('loginMsg').textContent='Mật khẩu chưa đúng. Vui lòng thử lại.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function init(){const tabs=document.getElementById('tabs'),root=document.getElementById('sections');sections.forEach((s,si)=>{state[si]=s.items.map(()=>null);currentQ[si]=0;let t=document.createElement('button');t.className='btn tab'+(si===0?' active':'');t.textContent=s.title;t.onclick=()=>showSection(si);tabs.appendChild(t);let d=document.createElement('section');d.className='section'+(si===0?' active':'');d.id='sec'+si;d.innerHTML=`<div class="panel"><div class="meta"><h2>${s.title}</h2><div class="result" id="score${si}">Điểm: 0/${s.items.length}</div></div><div class="progress"><div id="bar${si}"></div></div><div class="qnav" id="qnav${si}"></div><div id="question${si}"></div><div class="navrow"><button class="btn secondary" id="prev${si}" onclick="move(${si},-1)">← Câu trước</button><div><button class="btn secondary" onclick="resetSection(${si})">Reset phần này</button> <button class="btn" id="next${si}" onclick="move(${si},1)">Câu tiếp →</button></div></div></div>`;root.appendChild(d);renderQ(si);});}
function showSection(si){currentSection=si;document.querySelectorAll('.section').forEach((e,i)=>e.classList.toggle('active',i===si));document.querySelectorAll('.tab').forEach((e,i)=>e.classList.toggle('active',i===si));}
function renderQ(si){let s=sections[si],idx=currentQ[si],it=s.items[idx],ans=state[si][idx],box=document.getElementById('question'+si);let nav=document.getElementById('qnav'+si);nav.innerHTML='';s.items.forEach((_,i)=>{let b=document.createElement('button');b.className='qnum'+(state[si][i]!==null?' done':'')+(i===idx?' current':'');b.textContent=i+1;b.onclick=()=>{currentQ[si]=i;renderQ(si)};nav.appendChild(b)});let html=`<div class="small">Câu ${idx+1}/${s.items.length}</div>`;
if(it.reading){html+=`<div class="reading-layout"><div class="reading-pane"><h3>Reading passage</h3><div>${it.reading.replace(/\\n/g,'<br>')}</div><div class="translation"><b>Bản dịch tiếng Việt</b><p>${it.readingVi||''}</p></div></div><div class="question-pane"><h3>Question</h3><div class="question">${it.q}</div>`;}
else html+=`<div class="question">${it.q}</div>`;
if(it.opts){html+='<div class="options">';it.opts.forEach((o,oi)=>{let cls='opt';if(ans!==null){if(oi===it.a)cls+=' correct';else if(oi===ans)cls+=' wrong'}html+=`<button class="${cls}" ${ans!==null?'disabled':''} onclick="answer(${si},${idx},${oi})">${String.fromCharCode(65+oi)}. ${o}</button>`});html+='</div>'}
if(ans!==null){let ok=ans===it.a;html+=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ Chính xác!':'✗ Chưa chính xác.'}</b><p><b>Đáp án đúng:</b> ${String.fromCharCode(65+it.a)}. ${it.opts[it.a]}</p><p><b>Giải thích:</b> ${it.exp||''}</p>${it.sentence?`<p><b>Câu hoàn chỉnh:</b> ${it.sentence}</p>`:''}${it.meaning?`<p><b>Nghĩa tiếng Việt:</b> ${it.vi||it.meaning}</p>`:''}</div>`}
if(it.reading)html+='</div></div>';
box.innerHTML=html;document.getElementById('prev'+si).disabled=idx===0;document.getElementById('next'+si).disabled=idx===s.items.length-1;let done=state[si].filter(x=>x!==null).length;document.getElementById('score'+si).textContent=`Điểm: ${state[si].filter((x,i)=>x===s.items[i].a).length}/${s.items.length} · Đã làm ${done}/${s.items.length}`;document.getElementById('bar'+si).style.width=(done/s.items.length*100)+'%';}
function answer(si,idx,choice){if(state[si][idx]!==null)return;state[si][idx]=choice;renderQ(si)}
function move(si,delta){currentQ[si]=Math.max(0,Math.min(sections[si].items.length-1,currentQ[si]+delta));renderQ(si)}
function resetSection(si){if(!confirm('Bạn có chắc muốn xóa điểm và làm lại toàn bộ phần này?'))return;state[si]=sections[si].items.map(()=>null);currentQ[si]=0;renderQ(si)}
</script></body></html>
